<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>حملة الحصبة — المنشاة</title>
<style>
:root{--bg:#f6f7f4;--card:#fff;--ink:#1d2a24;--mut:#66736c;--line:#dfe4de;--pri:#0f7a5a;--bad:#b3261e;--warn:#9a6700;--ok:#1a7f37}
@media(prefers-color-scheme:dark){:root{--bg:#121816;--card:#1b2420;--ink:#e8eee9;--mut:#9aa8a0;--line:#2c3832;--pri:#3fbf95;--bad:#ff8a80;--warn:#e3b341;--ok:#56d364}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,"Segoe UI",Tahoma,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}h2{font-size:17px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
label{display:block;font-size:14px;color:var(--mut);margin:8px 0 2px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
button{padding:10px 16px;border:0;border-radius:10px;background:var(--pri);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--pri);border:1px solid var(--pri)}button:disabled{opacity:.5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:420px){.grid{grid-template-columns:1fr}}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.tabs button{background:var(--card);color:var(--ink);border:1px solid var(--line)}.tabs button.on{background:var(--pri);color:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:6px;border-bottom:1px solid var(--line);text-align:right}
.tw{overflow-x:auto}.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid var(--line)}
.bad{color:var(--bad)}.warn{color:var(--warn)}.ok{color:var(--ok)}.mut{color:var(--mut);font-size:14px}
#toast{position:fixed;bottom:16px;inset-inline:16px;max-width:420px;margin:auto;background:#222;color:#fff;padding:10px 14px;border-radius:10px;display:none;text-align:center}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tabs button{background:var(--card);color:var(--ink);border:1px solid var(--line);padding:8px 12px}.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.tabs.sm button{padding:5px 10px;font-size:14px;font-weight:500}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:8px 0}.stat{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px}.stat span{display:block;font-size:13px;color:var(--mut)}.stat b{font-size:20px}
.row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.meter{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0}.meter i{display:block;height:100%;background:var(--pri)}
.pill.ok{color:var(--ok);border-color:var(--ok)}.pill.warn{color:var(--warn);border-color:var(--warn)}.pill.bad{color:var(--bad);border-color:var(--bad)}.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.alert{border-inline-start:4px solid var(--mut);padding:6px 10px;margin:6px 0;background:var(--bg);border-radius:8px}.alert.bad{border-color:var(--bad)}.alert.warn{border-color:var(--warn)}.alert span{display:block;font-size:14px;color:var(--mut)}
.seg{display:flex;gap:6px;margin:8px 0}.seg button{flex:1;background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:8px 4px}.seg button.on{background:var(--pri);color:#fff}
.chk{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:15px}.chk input{width:auto}.checks{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px;margin-top:6px}
.cell{width:90px;padding:6px}details{margin:8px 0}summary{cursor:pointer;color:var(--pri)}textarea{resize:vertical}
.chkrow{align-items:center;border-bottom:1px solid var(--line);padding:4px 0}.chkrow span{flex:1;min-width:60%;font-size:15px}.chkrow select{width:auto;min-width:110px;padding:6px}
footer{text-align:center;color:var(--mut);font-size:13px;padding:20px}
a{color:var(--pri)}
</style></head><body><main id="app"></main><div id="toast"></div>
<footer>App Developer / Mohamed Ragab Mohamed</footer>
<script type="module" src="app.js"></script></body></html>
